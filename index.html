<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git 設定確認</title>
  <style>
    :root {
      --bg: rgba(0, 0, 0, 0.28);
      --panel: #f4f4f4;
      --title: #e1e1e1;
      --title-border: #cfcfcf;
      --button: #f0f0f0;
      --button-border: #bdbdbd;
      --text: #1b1b1b;
      --muted: #666;
      --danger: #dc3b3b;
      --danger-bg: #f9d7d7;
      --blue: #0a84ff;
      --blue-dark: #0770dc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dialog {
      width: 470px;
      max-width: calc(100vw - 24px);
      background: #ffffff;
      border: 1px solid var(--title-border);
      border-radius: 4px;
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      background: var(--title);
      border-bottom: 1px solid var(--title-border);
      padding: 0 10px 0 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .window-close {
      width: 18px;
      height: 18px;
      border: 0;
      background: transparent;
      color: #666;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .content {
      padding: 18px 18px 14px;
      background: #fff;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 64px;
    }

    .icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--danger-bg);
      border: 2px solid rgba(220, 59, 59, 0.16);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .icon {
      color: var(--danger);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      transform: translateY(-1px);
    }

    .message {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      padding-top: 4px;
    }

    .message-meta {
      margin-top: 8px;
      font-size: 11px;
      color: #4d4d4d;
      opacity: 0.9;
      word-break: break-word;
    }

    .code {
      display: inline-block;
      padding: 1px 4px;
      background: #f4f4f4;
      border: 1px solid #e3e3e3;
      border-radius: 2px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #111;
      vertical-align: middle;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 8px;
    }

    button {
      appearance: none;
      border: 1px solid var(--button-border);
      background: var(--button);
      color: #1a1a1a;
      padding: 7px 16px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      min-width: 90px;
      transition: filter 0.15s ease;
    }

    button:hover {
      filter: brightness(0.98);
    }

    .primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .primary:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .secondary {
      background: #f4f4f4;
    }

    @media (max-width: 520px) {
      .dialog {
        width: min(100vw - 20px, 470px);
      }

      .content {
        padding: 16px 14px 12px;
      }

      .actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        flex: 1 1 110px;
      }
    }
  </style>
</head>
<body>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="titlebar">
      <div id="dialog-title">Visual Studio Code</div>
      <button class="window-close" aria-label="關閉" type="button">×</button>
    </div>

    <div class="content">
      <div class="message-row">
        <div class="icon-wrap" aria-hidden="true">
          <div class="icon">×</div>
        </div>

        <div class="message">
          請確認您的 Git <span class="code">user.name</span> 及 <span class="code">user.email</span>
          <div class="message-meta">設定值：user.name = winfar58-git · user.email = winfar58@gmail.com</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" type="button">開啟 Git 記錄</button>
        <button class="secondary" type="button">深入了解</button>
        <button class="secondary" type="button">取消</button>
      </div>
    </div>
  </div>
</body>
</html>
